[project]
name = "storybook"
version = "0.1.0"
description = "Telegram bot: personalized AI storybook where the child is the hero"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "arq>=0.26",
    "redis>=5.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "pillow>=10.3",
    "playwright>=1.45",
    "aioboto3>=13.0",
    "google-genai>=1.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
faceqa = ["insightface>=0.7", "onnxruntime>=1.18", "numpy>=1.26", "opencv-python-headless>=4.10"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "aiosqlite>=0.20"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "RUF012", "RUF023", "B008", "B904"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["storybook*"]
